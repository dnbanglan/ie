<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ইনসাইট এডিশন ফটোকার্ড - INSIGHT EDITION</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif, 'SolaimanLipi', 'Kalpurush';
            background-color: #1a1e29;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        h1 {
            margin-bottom: 15px;
            font-size: 20px;
            color: #e2e8f0;
            text-align: center;
        }

        .main-container {
            display: flex;
            flex-direction: row;
            gap: 25px;
            background-color: #0d1117;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            max-width: 1300px;
            width: 100%;
        }

        .preview-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
        }

        .card-wrapper {
            width: 100%;
            aspect-ratio: 1 / 1;
            position: relative;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            border-radius: 6px;
            overflow: hidden;
            background-color: #000;
        }

        /* 1920x1920 scaled dynamically */
        #photocard {
            width: 1920px;
            height: 1920px;
            position: absolute;
            top: 0;
            left: 0;
            transform-origin: top left;
            background-color: #0B1224;
            overflow: hidden;
            font-family: 'SolaimanLipi', 'Kalpurush', sans-serif;
        }

        /* 1. Feature Image */
        .feature-image-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 1920px;
            height: 1080px;
            overflow: hidden;
            background-color: #1a2236;
        }

        #feature-img {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform-origin: center center;
        }

        .img-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #8b949e;
            font-size: 40px;
            border: 2px dashed #30363d;
        }

        /* 2. Date Box */
        .date-box {
            position: absolute;
            top: 88px;
            left: 1495.857px;
            width: 426px;
            height: 76px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: 48px;
            font-weight: bold;
            z-index: 10;
            border-bottom: 4px solid rgba(255, 255, 255, 0.5);
            background: rgba(0, 0, 0, 0.25);
            backdrop-filter: blur(2px);
            padding-bottom: 4px;
        }

        /* 3. Branding Label */
        .branding-label {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #0B1224;
            color: #ffffff;
            font-size: 38px;
            font-weight: 900;
            padding: 12px 35px;
            letter-spacing: 2px;
            z-index: 10;
            border: 4px solid #ffffff;
            border-top-left-radius: 20px;
            border-top-right-radius: 0px;
            border-bottom-right-radius: 20px;
            border-bottom-left-radius: 0px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            text-transform: uppercase;
            white-space: nowrap;
        }

        /* 4. White Divider Line */
        .divider-line {
            position: absolute;
            top: 1072px;
            left: 0;
            width: 1920px;
            height: 8px;
            background-color: #ffffff;
            z-index: 11;
        }

        /* 5. Headline Container */
        .headline-container {
            position: absolute;
            top: 1165px;
            left: 0;
            width: 1920px;
            height: 398px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 60px;
            box-sizing: border-box;
            z-index: 5;
        }

        .headline-text {
            color: #ffffff;
            font-size: 80px;
            font-weight: bold;
            text-align: center;
            line-height: 1.35;
            width: 100%;
            word-wrap: break-word;
            transition: all 0.2s ease;
        }

        /* 7. Footer Bar */
        .footer-bar {
            position: absolute;
            top: 1709px;
            left: 0;
            width: 1920px;
            height: 89px;
            z-index: 5;
            background: linear-gradient(
                90deg, 
                rgba(16, 31, 60, 0) 0px, 
                rgba(16, 31, 60, 1) 300px, 
                rgba(16, 31, 60, 1) 1620px, 
                rgba(16, 31, 60, 0) 1920px
            );
        }

        .footer-left {
            position: absolute;
            left: 400px;
            top: 50%;
            transform: translateY(-50%);
            color: #ffffff;
            font-size: 28px;
            font-weight: 500;
            white-space: nowrap;
        }

        .footer-right {
            position: absolute;
            right: 400px;
            top: 50%;
            transform: translateY(-50%);
            color: #ffffff;
            font-size: 28px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 12px;
            white-space: nowrap;
        }

        .fb-icon {
            width: 32px;
            height: 32px;
            fill: #ffffff;
        }

        /* Controls Panel */
        .controls-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
        }

        .control-group {
            background-color: #161b22;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #30363d;
        }

        .control-group h3 {
            font-size: 15px;
            margin-bottom: 12px;
            color: #58a6ff;
            border-bottom: 1px solid #30363d;
            padding-bottom: 5px;
        }

        label {
            display: block;
            font-size: 14px;
            margin-bottom: 6px;
            color: #c9d1d9;
        }

        input[type="text"], textarea, input[type="date"] {
            width: 100%;
            padding: 10px;
            background-color: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: #ffffff;
            font-size: 14px;
            margin-bottom: 10px;
            font-family: inherit;
        }

        textarea {
            resize: vertical;
            height: 70px;
        }

        .slider-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }

        .slider-row label {
            width: 110px;
            margin-bottom: 0;
            font-size: 13px;
        }

        input[type="range"] {
            flex: 1;
            accent-color: #58a6ff;
        }

        .value-disp {
            width: 45px;
            text-align: right;
            font-size: 12px;
            color: #8b949e;
        }

        /* Reset Button Style */
        .btn-reset {
            background-color: #21262d;
            color: #f85149;
            border: 1px solid #30363d;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .btn-reset:hover {
            background-color: #30363d;
            border-color: #f85149;
        }

        .checkbox-row {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            font-size: 14px;
        }

        .btn-download {
            background-color: #238636;
            color: #ffffff;
            border: none;
            padding: 14px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 10px;
            width: 100%;
        }

        .btn-download:hover {
            background-color: #2ea043;
        }

        .file-upload-btn {
            display: inline-block;
            padding: 10px 16px;
            background-color: #21262d;
            color: #c9d1d9;
            border: 1px solid #30363d;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            margin-bottom: 10px;
            text-align: center;
            width: 100%;
        }

        .file-upload-btn:hover {
            background-color: #30363d;
        }

        input[type="file"] {
            display: none;
        }

        @media (max-width: 900px) {
            .main-container {
                flex-direction: column;
                align-items: center;
                padding: 15px;
            }

            .preview-area {
                max-width: 100%;
            }

            .slider-row label {
                width: 100px;
            }
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
.today-date-btn {
  margin-top: 8px;
  padding: 8px 12px;
  border: 0;
  border-radius: 6px;
  background: #1f5eff;
  color: #fff;
  font: inherit;
  cursor: pointer;
}
.today-date-btn:hover { filter: brightness(.94); }
</style>
</head>
<body>

    <h1>ইনসাইট এডিশন ফটোকার্ড</h1>

    <div class="main-container">
        <!-- Preview Panel -->
        <div class="preview-area">
            <div class="card-wrapper" id="card-wrapper">
                <div id="photocard">
                    <!-- Feature Image -->
                    <div class="feature-image-container">
                        <div id="placeholder-text" class="img-placeholder">ছবি সিলেক্ট করুন</div>
                        <img id="feature-img" src="" alt="Feature Image" style="display: none;">
                        <!-- Branding Label -->
                        <div class="branding-label">INSIGHT EDITION</div>
                    </div>

                    <!-- Date Box -->
                    <div class="date-box" id="card-date">০৪ নভেম্বর ২০২৬</div>

                    <!-- White Divider Line -->
                    <div class="divider-line"></div>

                    <!-- Headline Container -->
                    <div class="headline-container">
                        <div class="headline-text" id="card-headline"> </div>
                    </div>

                    <!-- Footer Bar -->
                    <div class="footer-bar">
                        <div class="footer-left" id="card-footer-left">বিস্তারিত কমেন্টে...</div>
                        <div class="footer-right">
                            <svg class="fb-icon" viewBox="0 0 24 24">
                                <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
                            </svg>
                            <span id="card-social-handle">/InsightEdition</span>
                        </div>
                    </div>
                </div>
            </div>
            <p style="margin-top: 8px; font-size: 12px; color: #8b949e; text-align: center;">লাইভ প্রিভিউ</p>
        </div>

        <!-- Controls Panel -->
        <div class="controls-panel">
            <!-- 1. Feature Image Control -->
            <div class="control-group">
                <h3>১. ফিচার ছবি কন্ট্রোল</h3>
                <label class="file-upload-btn">
                    ছবি আপলোড করুন
                    <input type="file" id="img-input" accept="image/*">
                </label>
                
                <div class="slider-row">
                    <label for="img-zoom">জুম (Zoom):</label>
                    <input type="range" id="img-zoom" min="1" max="3" step="0.05" value="1">
                    <span class="value-disp" id="zoom-val">1x</span>
                    <button class="btn-reset" id="reset-zoom">রিসেট</button>
                </div>
                <div class="slider-row">
                    <label for="img-pan-x">ডানে-বামে:</label>
                    <input type="range" id="img-pan-x" min="-500" max="500" step="5" value="0">
                    <span class="value-disp" id="pan-x-val">0px</span>
                    <button class="btn-reset" id="reset-pan-x">রিসেট</button>
                </div>
                <div class="slider-row">
                    <label for="img-pan-y">উপরে-নিচে:</label>
                    <input type="range" id="img-pan-y" min="-500" max="500" step="5" value="0">
                    <span class="value-disp" id="pan-y-val">0px</span>
                    <button class="btn-reset" id="reset-pan-y">রিসেট</button>
                </div>
            </div>

            <!-- 2. Date Control -->
            <div class="control-group">
                <h3>২. তারিখ নির্ধারণ</h3>
                <input type="date" id="date-picker">
<button type="button" id="today-date-btn" class="today-date-btn">আজকের তারিখে ফিরুন</button>
            </div>

            <!-- 3. Headline Control -->
            <div class="control-group">
                <h3>৩. সংবাদ শিরোনাম (Headline)</h3>
                <label for="headline-input">শিরোনাম / মূল হেডিং</label>
                <textarea id="headline-input" rows="3" placeholder="সংবাদের শিরোনাম লিখুন...">ইনসাইট এডিশন এর সংবাদ শিরোনাম লিখুন</textarea>

                <div class="slider-row">
                    <label for="font-size">হেডলাইন ফন্ট সাইজ:</label>
                    <input type="range" id="font-size" min="40" max="120" value="90">
                    <span class="value-disp" id="font-size-val">90px</span>
                </div>

                <div class="slider-row">
                    <label for="side-margin">অটো মার্জিন:</label>
                    <input type="range" id="side-margin" min="40" max="450" value="250">
                    <span class="value-disp" id="side-margin-val">250px</span>
                </div>
            </div>

            <!-- 4. Footer Settings -->
            <div class="control-group">
                <h3>৪. ফুটার সেটিংস</h3>
                <label class="checkbox-row">
                    <input type="checkbox" id="toggle-comment" checked>
                    "বিস্তারিত কমেন্টে..." লেখা প্রদর্শন করুন
                </label>
            </div>

            <!-- Download Button -->
            <button class="btn-download" id="download-btn">ফটোকার্ড ডাউনলোড করুন (JPG)</button>
        </div>
    </div>

    <script>
        const cardWrapper = document.getElementById('card-wrapper');
        const photocard = document.getElementById('photocard');

        // Dynamic Scale Update for Responsive Preview
        function updateScale() {
            const wrapperWidth = cardWrapper.clientWidth;
            const scale = wrapperWidth / 1920;
            photocard.style.transform = `scale(${scale})`;
        }

        window.addEventListener('resize', updateScale);
        updateScale();

        // DOM Elements
        const imgInput = document.getElementById('img-input');
        const featureImg = document.getElementById('feature-img');
        const placeholderText = document.getElementById('placeholder-text');
        
        const imgZoom = document.getElementById('img-zoom');
        const imgPanX = document.getElementById('img-pan-x');
        const imgPanY = document.getElementById('img-pan-y');
        const zoomVal = document.getElementById('zoom-val');
        const panXVal = document.getElementById('pan-x-val');
        const panYVal = document.getElementById('pan-y-val');

        // Reset Buttons
        const resetZoomBtn = document.getElementById('reset-zoom');
        const resetPanXBtn = document.getElementById('reset-pan-x');
        const resetPanYBtn = document.getElementById('reset-pan-y');

        const datePicker = document.getElementById('date-picker');
        const cardDate = document.getElementById('card-date');

        const headlineInput = document.getElementById('headline-input');
        const cardHeadline = document.getElementById('card-headline');
        const fontSizeInput = document.getElementById('font-size');
        const fontSizeVal = document.getElementById('font-size-val');
        const sideMarginInput = document.getElementById('side-margin');
        const sideMarginVal = document.getElementById('side-margin-val');

        const toggleComment = document.getElementById('toggle-comment');
        const cardFooterLeft = document.getElementById('card-footer-left');
        const downloadBtn = document.getElementById('download-btn');

        // Digit Converter
        function toBanglaNum(str) {
            const banglaDigits = ['০', '১', '২', '৩', '৪', '৫', '৬', '৭', '৮', '৯'];
            return str.replace(/[0-9]/g, digit => banglaDigits[digit]);
        }

        // Format Date to Bangla
        function formatBanglaDate(date) {
            const months = [
                'জানুয়ারি', 'ফেব্রুয়ারি', 'মার্চ', 'এপ্রিল', 'মে', 'জুন',
                'জুলাই', 'আগস্ট', 'সেপ্টেম্বর', 'অক্টোবর', 'নভেম্বর', 'ডিসেম্বর'
            ];
            const day = toBanglaNum(String(date.getDate()).padStart(2, '0'));
            const month = months[date.getMonth()];
            const year = toBanglaNum(String(date.getFullYear()));

            return `${day} ${month} ${year}`;
        }

        // Set Current System Date Automatically
        function setAutoDate() {
            const today = new Date();
            const year = today.getFullYear();
            const month = String(today.getMonth() + 1).padStart(2, '0');
            const day = String(today.getDate()).padStart(2, '0');
            
            datePicker.value = `${year}-${month}-${day}`;
            cardDate.textContent = formatBanglaDate(today);
        }

        setAutoDate();

        // Date Change Event
        datePicker.addEventListener('change', (e) => {
            if (e.target.value) {
                const parts = e.target.value.split('-');
                const selectedDate = new Date(parts[0], parts[1] - 1, parts[2]);
                cardDate.textContent = formatBanglaDate(selectedDate);
            }
        });

        // Image Handling
        imgInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    featureImg.src = event.target.result;
                    featureImg.style.display = 'block';
                    placeholderText.style.display = 'none';
                    resetImageControls();
                };
                reader.readAsDataURL(file);
            }
        });

        function updateImageTransform() {
            const scale = imgZoom.value;
            const x = imgPanX.value;
            const y = imgPanY.value;
            featureImg.style.transform = `scale(${scale}) translate(${x}px, ${y}px)`;
            zoomVal.textContent = `${scale}x`;
            panXVal.textContent = `${x}px`;
            panYVal.textContent = `${y}px`;
        }

        function resetImageControls() {
            imgZoom.value = 1;
            imgPanX.value = 0;
            imgPanY.value = 0;
            updateImageTransform();
        }

        imgZoom.addEventListener('input', updateImageTransform);
        imgPanX.addEventListener('input', updateImageTransform);
        imgPanY.addEventListener('input', updateImageTransform);

        // Individual Reset Button Event Listeners
        resetZoomBtn.addEventListener('click', () => {
            imgZoom.value = 1;
            updateImageTransform();
        });

        resetPanXBtn.addEventListener('click', () => {
            imgPanX.value = 0;
            updateImageTransform();
        });

        resetPanYBtn.addEventListener('click', () => {
            imgPanY.value = 0;
            updateImageTransform();
        });

        // Automatically balance the headline into 1, 2 or 3 lines.
        function splitHeadlineIntoLines(text, maxWidth, fontSize) {
            const words = text.trim().split(/\s+/).filter(Boolean);
            if (!words.length) return [];

            const measureCanvas = document.createElement('canvas');
            const ctx = measureCanvas.getContext('2d');
            ctx.font = `bold ${fontSize}px 'SolaimanLipi', 'Kalpurush', sans-serif`;
            const widthOf = value => ctx.measureText(value).width;
            const maxLines = Math.min(3, words.length);

            for (let lineCount = 1; lineCount <= maxLines; lineCount++) {
                let bestLines = null;
                let bestScore = Infinity;

                function findPartitions(start, current) {
                    if (current.length === lineCount - 1) {
                        const lastLine = words.slice(start).join(' ');
                        if (!lastLine) return;
                        const lastWidth = widthOf(lastLine);
                        if (lastWidth > maxWidth) return;

                        const widths = [...current.map(widthOf), lastWidth];
                        const score = Math.max(...widths) - Math.min(...widths);
                        if (score < bestScore) {
                            bestScore = score;
                            bestLines = [...current, lastLine];
                        }
                        return;
                    }

                    const remainingLines = lineCount - current.length - 1;
                    const lastEnd = words.length - remainingLines;
                    for (let end = start + 1; end <= lastEnd; end++) {
                        const candidate = words.slice(start, end).join(' ');
                        if (widthOf(candidate) > maxWidth) break;
                        findPartitions(end, [...current, candidate]);
                    }
                }

                findPartitions(0, []);
                if (bestLines) return bestLines;
            }

            return [text.trim()];
        }

        function formatHeadline() {
            const text = headlineInput.value.trim();
            const fontSize = Number(fontSizeInput.value);
            const margin = Number(sideMarginInput.value);

            fontSizeVal.textContent = `${fontSize}px`;
            sideMarginVal.textContent = `${margin}px`;
            cardHeadline.style.fontSize = `${fontSize}px`;
            cardHeadline.style.lineHeight = '1.25';

            const container = document.querySelector('.headline-container');
            container.style.paddingLeft = `${margin}px`;
            container.style.paddingRight = `${margin}px`;

            cardHeadline.replaceChildren();
            if (!text) return;

            const availableWidth = 1920 - (margin * 2);
            const lines = splitHeadlineIntoLines(text, availableWidth, fontSize);
            lines.forEach((line, index) => {
                if (index) cardHeadline.appendChild(document.createElement('br'));
                cardHeadline.appendChild(document.createTextNode(line));
            });
        }

        headlineInput.addEventListener('input', formatHeadline);
        fontSizeInput.addEventListener('input', formatHeadline);
        sideMarginInput.addEventListener('input', formatHeadline);
        formatHeadline();

        // Footer Comment Display Toggle
        toggleComment.addEventListener('change', (e) => {
            cardFooterLeft.style.display = e.target.checked ? 'block' : 'none';
        });

        // Download JPG
        downloadBtn.addEventListener('click', () => {
            downloadBtn.textContent = "প্রসেসিং হচ্ছে...";
            downloadBtn.disabled = true;

            const originalTransform = photocard.style.transform;
            photocard.style.transform = 'none';

            html2canvas(photocard, {
                width: 1920,
                height: 1920,
                scale: 1,
                useCORS: true,
                allowTaint: true,
                backgroundColor: '#0B1224'
            }).then(canvas => {
                photocard.style.transform = originalTransform;
                const link = document.createElement('a');
                link.download = `Insight_Edition_${Date.now()}.jpg`;
                link.href = canvas.toDataURL('image/jpeg', 0.95);
                link.click();

                downloadBtn.textContent = "ফটোকার্ড ডাউনলোড করুন (JPG)";
                downloadBtn.disabled = false;
            }).catch(err => {
                console.error(err);
                alert('ছবি তৈরি করতে সমস্যা হয়েছে!');
                photocard.style.transform = originalTransform;
                downloadBtn.textContent = "ফটোকার্ড ডাউনলোড করুন (JPG)";
                downloadBtn.disabled = false;
            });
        });
    </script>

<script>
document.addEventListener('DOMContentLoaded', function () {
  const todayButton = document.getElementById('today-date-btn');
  const datePicker = document.getElementById('date-picker');
  if (!todayButton || !datePicker) return;
  todayButton.addEventListener('click', function () {
    if (typeof setAutoDate === 'function') {
      setAutoDate();
      datePicker.dispatchEvent(new Event('change', { bubbles: true }));
    } else {
      const now = new Date();
      const localDate = new Date(now.getTime() - now.getTimezoneOffset() * 60000)
        .toISOString().slice(0, 10);
      datePicker.value = localDate;
      datePicker.dispatchEvent(new Event('change', { bubbles: true }));
    }
  });
});
</script>
