<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ইনসাইট এডিশন ফটোকার্ড জেনারেটর - INSIGHT EDITION</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #1a1e29; color: #fff; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; }
    h1 { margin-bottom: 20px; font-size: 22px; color: #e2e8f0; text-align: center; }
    .main-container { display: flex; gap: 25px; background: #0d1117; padding: 20px; border-radius: 12px; box-shadow: 0 10px 25px #0008; max-width: 1400px; width: 100%; }
    .preview-area { display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 550px; margin: 0 auto; }
    .card-wrapper { width: 100%; aspect-ratio: 1; position: relative; box-shadow: 0 4px 20px #000b; border-radius: 6px; overflow: hidden; background: #0B1224; }
    #photocard { width: 1920px; height: 1920px; position: absolute; inset: 0 auto auto 0; transform-origin: top left; background: #0B1224; overflow: hidden; font-family: 'SolaimanLipi', 'Kalpurush', sans-serif; }
    .feature-image-container { position: absolute; inset: 0 0 auto; width: 1920px; height: 1080px; overflow: hidden; background: #1a2236; }
    #feature-img { position: absolute; width: 100%; height: 100%; object-fit: cover; transform-origin: center; }
    .img-placeholder { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; color: #8b949e; font-size: 45px; border: 2px dashed #30363d; }
    .date-box { position: absolute; top: 88px; right: 0; width: 426px; height: 76px; display: flex; align-items: center; justify-content: center; color: white; font-size: 38px; font-weight: bold; z-index: 10; background: #0b12244d; }
    .branding-container { position: absolute; top: 939px; left: 0; width: 1920px; height: 131px; display: flex; align-items: center; justify-content: center; z-index: 12; pointer-events: none; }
    .branding-label { background: #0B1224; color: #fff; font-size: 52px; font-weight: 900; padding: 10px 50px; letter-spacing: 2px; border: 4px solid white; border-radius: 35px 0 35px 0; white-space: nowrap; box-shadow: 0 4px 15px #0006; }
    .divider-line { position: absolute; top: 1072px; left: 0; width: 1920px; height: 8px; background: white; z-index: 11; }
    .headline-container { position: absolute; top: 1153px; left: 0; width: 1920px; height: 335px; display: flex; align-items: center; justify-content: center; padding: 0 100px; z-index: 5; overflow: hidden; }
    .headline-text { color: white; font-size: 72px; font-weight: bold; text-align: center; line-height: 1.3; width: 100%; overflow-wrap: anywhere; }
    .footer-bar { position: absolute; top: 1542px; left: 0; width: 1920px; height: 89px; z-index: 5; background: linear-gradient(90deg, transparent, #101f3c 300px, #101f3c 1620px, transparent); }
    .footer-left, .footer-right { position: absolute; top: 50%; transform: translateY(-50%); color: white; font-size: 30px; white-space: nowrap; }
    .footer-left { left: 400px; }
    .footer-right { right: 400px; display: flex; align-items: center; gap: 12px; }
    .fb-icon { width: 36px; height: 36px; fill: white; }
    .bottom-bg-spacer { position: absolute; top: 1631px; left: 0; width: 1920px; height: 11px; background: #0B1224; z-index: 4; }
    .ad-banner-container { position: absolute; top: 1642px; left: 0; width: 1920px; height: 278px; overflow: hidden; background: #000; z-index: 10; }
    #ad-banner-img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .controls-panel { flex: 1; display: flex; flex-direction: column; gap: 15px; width: 100%; }
    .control-group { background: #161b22; padding: 15px; border-radius: 8px; border: 1px solid #30363d; }
    .control-group h3 { font-size: 15px; margin-bottom: 12px; color: #58a6ff; border-bottom: 1px solid #30363d; padding-bottom: 5px; }
    label { display: block; font-size: 14px; margin-bottom: 6px; color: #c9d1d9; }
    input[type="text"], select, textarea, input[type="date"] { width: 100%; padding: 10px; background: #0d1117; border: 1px solid #30363d; border-radius: 6px; color: white; font-size: 14px; margin-bottom: 10px; font-family: inherit; }
    textarea { resize: vertical; height: 75px; }
    .slider-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
    .slider-row label { width: 120px; margin: 0; font-size: 13px; }
    input[type="range"] { flex: 1; accent-color: #58a6ff; }
    .value-disp { width: 50px; text-align: right; font-size: 12px; color: #8b949e; }
    .btn-action { background: #21262d; color: #c9d1d9; border: 1px solid #30363d; padding: 8px 12px; border-radius: 4px; font-size: 13px; cursor: pointer; white-space: nowrap; }
    .btn-action:hover { background: #30363d; border-color: #8b949e; }
    .btn-download { background: #238636; color: white; border: 0; padding: 14px; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; width: 100%; }
    .btn-download:hover { background: #2ea043; }
    .btn-download:disabled { opacity: .7; cursor: wait; }
    .file-upload-btn { display: block; padding: 10px 16px; background: #21262d; color: #c9d1d9; border: 1px solid #30363d; border-radius: 6px; cursor: pointer; font-size: 14px; margin-bottom: 10px; text-align: center; width: 100%; }
    input[type="file"] { display: none; }
    .cycle-info { font-size: 13px; color: #8b949e; margin: 4px 0 10px; }
    @media (max-width: 900px) { .main-container { flex-direction: column; align-items: center; padding: 15px; } .preview-area { max-width: 100%; } }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>
  <h1>ইনসাইট এডিশন ফটোকার্ড জেনারেটর</h1>
  <div class="main-container">
    <div class="preview-area">
      <div class="card-wrapper" id="card-wrapper">
        <div id="photocard">
          <div class="feature-image-container"><div id="placeholder-text" class="img-placeholder">ফিচার ছবি আপলোড করুন</div><img id="feature-img" alt="Feature Image" style="display:none"></div>
          <div class="date-box" id="card-date"></div>
          <div class="branding-container"><div class="branding-label">INSIGHT EDITION</div></div>
          <div class="divider-line"></div>
          <div class="headline-container"><div class="headline-text" id="card-headline"></div></div>
          <div class="footer-bar"><div class="footer-left" id="card-footer-left">বিস্তারিত কমেন্টে</div><div class="footer-right"><svg class="fb-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg><span>/InsightEdition</span></div></div>
          <div class="bottom-bg-spacer"></div>
          <div class="ad-banner-container"><img id="ad-banner-img" alt="বিজ্ঞাপন ব্যানার"></div>
        </div>
      </div>
      <p style="margin-top:10px;font-size:13px;color:#8b949e;text-align:center">লাইভ প্রিভিউ (১৯২০ x ১৯২০ px)</p>
    </div>
    <div class="controls-panel">
      <div class="control-group">
        <h3>১. ফিচার ছবি আপলোড ও পজিশনিং</h3>
        <label class="file-upload-btn">ছবি আপলোড করুন<input type="file" id="img-input" accept="image/*"></label>
        <div class="slider-row"><label for="img-zoom">জুম:</label><input type="range" id="img-zoom" min="1" max="3" step="0.05" value="1"><span class="value-disp" id="zoom-val">1x</span></div>
        <div class="slider-row"><label for="img-pan-x">ডানে-বামে:</label><input type="range" id="img-pan-x" min="-600" max="600" step="5" value="0"><span class="value-disp" id="pan-x-val">0px</span></div>
        <div class="slider-row"><label for="img-pan-y">উপরে-নিচে:</label><input type="range" id="img-pan-y" min="-600" max="600" step="5" value="0"><span class="value-disp" id="pan-y-val">0px</span></div>
      </div>
      <div class="control-group"><h3>২. তারিখ নির্ধারণ</h3><div style="display:flex;gap:10px;align-items:center"><input type="date" id="date-picker"><button type="button" id="today-date-btn" class="btn-action">আজকের তারিখ</button></div></div>
      <div class="control-group"><h3>৩. সংবাদ শিরোনাম</h3><label for="headline-input">শিরোনাম লিখুন:</label><textarea id="headline-input" rows="3" placeholder="সংবাদের শিরোনাম লিখুন..."></textarea><div class="slider-row"><label for="font-size">টেক্সট সাইজ:</label><input type="range" id="font-size" min="40" max="130" value="72"><span class="value-disp" id="font-size-val">72px</span></div><div class="slider-row"><label for="side-margin">পাশের মার্জিন:</label><input type="range" id="side-margin" min="60" max="500" value="100"><span class="value-disp" id="side-margin-val">100px</span></div></div>
      <div class="control-group"><h3>৪. ফুটার সেটিংস</h3><label><input type="checkbox" id="toggle-comment" checked> “বিস্তারিত কমেন্টে” লেখা প্রদর্শন করুন</label></div>
      <div class="control-group"><h3>৫. বিজ্ঞাপন ব্যানার (অটো সাইকেল)</h3><label for="ad-select">এই ফটোকার্ডের বিজ্ঞাপন নির্বাচন করুন:</label><select id="ad-select"></select><p class="cycle-info" id="cycle-info"></p><button type="button" id="next-ad-btn" class="btn-action" style="width:100%">ম্যানুয়ালি পরবর্তী বিজ্ঞাপন ↻</button></div>
      <button class="btn-download" id="download-btn">বিজ্ঞাপনসহ ফটোকার্ড ডাউনলোড করুন (HD JPG)</button>
    </div>
  </div>
  <script>
    const adBanners = [
      { name: 'NCEM — নিউ ক্লাসিক ইভেন্ট ম্যানেজমেন্ট', url: 'https://www.dnbangla.com.bd/wp-content/uploads/2026/03/ads-ncem.jpg' },
      { name: 'Mukti Clinic — মুক্তি ক্লিনিক ও ডায়াগনস্টিক সেন্টার', url: 'https://www.dnbangla.com.bd/wp-content/uploads/2026/03/mukti-clinic.jpg' },
      { name: 'Rupon — খাদিজা হুমায়রা রূপন', url: 'https://www.dnbangla.com.bd/wp-content/uploads/2026/10/ads-khadija-humayra-rupon.jpg' },
      { name: 'Monir Dental — মনির ডেন্টাল কেয়ার', url: 'https://www.dnbangla.com.bd/wp-content/uploads/2026/03/Monir-Dental.jpg' },
      { name: 'NCTTA — NCTTA একাডেমি', url: 'https://www.dnbangla.com.bd/wp-content/uploads/2026/03/NCTTA-Academy.jpg' }
    ];
    const cycleKey = 'insightEditionAdCycleCount';
    const readCycle = () => { const n = Number.parseInt(localStorage.getItem(cycleKey) || '0', 10); return Number.isFinite(n) && n >= 0 ? n : 0; };
    let cycleCount = readCycle();
    let currentAdIndex = cycleCount % adBanners.length;
    const $ = id => document.getElementById(id);
    const card = $('photocard'), wrapper = $('card-wrapper'), adImg = $('ad-banner-img'), adSelect = $('ad-select');
    adBanners.forEach((ad, index) => { const option = document.createElement('option'); option.value = index; option.textContent = `বিজ্ঞাপন ${String(index + 1).padStart(2, '0')}: ${ad.name}`; adSelect.appendChild(option); });
    function updateCycleInfo() { $('cycle-info').textContent = `পরবর্তী ফটোকার্ড: বিজ্ঞাপন ${String(currentAdIndex + 1).padStart(2, '0')} / ${adBanners.length} (প্রতি ডাউনলোডে স্বয়ংক্রিয়ভাবে পরেরটি)`; }
    function setAdBanner(index, manual = false) {
      currentAdIndex = ((index % adBanners.length) + adBanners.length) % adBanners.length;
      adSelect.value = String(currentAdIndex);
      adImg.crossOrigin = 'anonymous';
      adImg.src = adBanners[currentAdIndex].url;
      updateCycleInfo();
      if (manual) { cycleCount = Math.floor(cycleCount / adBanners.length) * adBanners.length + currentAdIndex; localStorage.setItem(cycleKey, String(cycleCount)); }
    }
    adSelect.addEventListener('change', event => setAdBanner(Number(event.target.value), true));
    $('next-ad-btn').addEventListener('click', () => setAdBanner(currentAdIndex + 1, true));
    function updateScale() { card.style.transform = `scale(${wrapper.clientWidth / 1920})`; }
    window.addEventListener('resize', updateScale);
    $('img-input').addEventListener('change', event => {
      const file = event.target.files[0]; if (!file) return;
      const reader = new FileReader(); reader.onload = e => { $('feature-img').src = e.target.result; $('feature-img').style.display = 'block'; $('placeholder-text').style.display = 'none'; $('img-zoom').value = 1; $('img-pan-x').value = 0; $('img-pan-y').value = 0; updateImageTransform(); }; reader.readAsDataURL(file);
    });
    function updateImageTransform() { const z = $('img-zoom').value, x = $('img-pan-x').value, y = $('img-pan-y').value; $('feature-img').style.transform = `scale(${z}) translate(${x}px, ${y}px)`; $('zoom-val').textContent = `${z}x`; $('pan-x-val').textContent = `${x}px`; $('pan-y-val').textContent = `${y}px`; }
    ['img-zoom', 'img-pan-x', 'img-pan-y'].forEach(id => $(id).addEventListener('input', updateImageTransform));
    const months = ['জানুয়ারি','ফেব্রুয়ারি','মার্চ','এপ্রিল','মে','জুন','জুলাই','আগস্ট','সেপ্টেম্বর','অক্টোবর','নভেম্বর','ডিসেম্বর'];
    const toBanglaNum = value => String(value).replace(/[0-9]/g, digit => '০১২৩৪৫৬৭৮৯'[digit]);
    function setDate(date) { $('date-picker').value = `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`; $('card-date').textContent = `${toBanglaNum(String(date.getDate()).padStart(2,'0'))} ${months[date.getMonth()]} ${toBanglaNum(date.getFullYear())}`; }
    setDate(new Date()); $('date-picker').addEventListener('change', e => { if (e.target.value) { const [y,m,d] = e.target.value.split('-').map(Number); const date = new Date(y,m-1,d); $('card-date').textContent = `${toBanglaNum(String(d).padStart(2,'0'))} ${months[m-1]} ${toBanglaNum(y)}`; } }); $('today-date-btn').addEventListener('click', () => setDate(new Date()));
    function formatHeadline() { const text = $('headline-input').value.trim(), size = Number($('font-size').value), margin = Number($('side-margin').value); $('font-size-val').textContent = `${size}px`; $('side-margin-val').textContent = `${margin}px`; $('card-headline').style.fontSize = `${size}px`; document.querySelector('.headline-container').style.padding = `0 ${margin}px`; $('card-headline').textContent = text; }
    ['headline-input','font-size','side-margin'].forEach(id => $(id).addEventListener(id === 'headline-input' ? 'input' : 'input', formatHeadline));
    $('toggle-comment').addEventListener('change', e => { $('card-footer-left').style.visibility = e.target.checked ? 'visible' : 'hidden'; });
    function waitForImage(image) { if (image.complete && image.naturalWidth > 0) return Promise.resolve(); return new Promise((resolve, reject) => { image.addEventListener('load', resolve, { once: true }); image.addEventListener('error', () => reject(new Error('বিজ্ঞাপন ব্যানার লোড করা যায়নি। ইন্টারনেট সংযোগ বা ছবির CORS অনুমতি পরীক্ষা করুন।')), { once: true }); }); }
    $('download-btn').addEventListener('click', async () => {
      const button = $('download-btn'), originalTransform = card.style.transform;
      button.disabled = true; button.textContent = 'বিজ্ঞাপনসহ ফটোকার্ড তৈরি হচ্ছে...';
      try {
        await waitForImage(adImg);
        if (document.fonts && document.fonts.ready) await document.fonts.ready;
        card.style.transform = 'none';
        const canvas = await html2canvas(card, { width: 1920, height: 1920, scale: 1, useCORS: true, backgroundColor: '#0B1224' });
        const link = document.createElement('a'); link.download = `Insight_Edition_${Date.now()}.jpg`; link.href = canvas.toDataURL('image/jpeg', 0.98); link.click();
        // A successful export is one new post: persist the next slot so cycling continues across reloads.
        cycleCount += 1; localStorage.setItem(cycleKey, String(cycleCount)); setAdBanner(cycleCount % adBanners.length);
      } catch (error) { console.error(error); alert(error.message || 'ফটোকার্ড তৈরি করতে সমস্যা হয়েছে!'); }
      finally { card.style.transform = originalTransform; button.disabled = false; button.textContent = 'বিজ্ঞাপনসহ ফটোকার্ড ডাউনলোড করুন (HD JPG)'; updateScale(); }
    });
    setAdBanner(currentAdIndex); updateScale(); formatHeadline();
  </script>
</body>
</html>
